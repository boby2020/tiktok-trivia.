<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brad 3D Spectaculos - TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #010308;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 540px;
            background: radial-gradient(circle at 50% 25%, #1b1035 0%, #090614 55%, #010308 100%);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.95);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(15, 15, 30, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #controls.hidden { transform: translateY(-160%); }
        .row { display: flex; gap: 6px; justify-content: center; align-items: center; }
        input {
            background: #090614;
            border: 1px solid #f59e0b;
            color: #fff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 13px;
            width: 140px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn-connect { background: #ec4899; }
        .btn-test { background: #10b981; }
        .btn-gift { background: #f59e0b; color: #000; }
        .btn-music { background: #8b5cf6; }
        #status { font-size: 11px; color: #cbd5e1; text-align: center; }
        
        #toggle-ui {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 11;
            background: rgba(0,0,0,0.6);
            color: #fde047;
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .bottom-banner {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 5;
            color: #fde047;
            font-weight: 900;
            font-size: 13px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="treeCanvas"></canvas>

    <button id="toggle-ui" onclick="toggleControls()">🎄</button>

    <div id="controls">
        <div class="row">
            <input type="text" id="username" value="eusebiusebisebi" placeholder="User TikTok">
            <button class="btn-connect" onclick="connectTikTok()">Conectează</button>
            <button class="btn-music" id="music-btn" onclick="toggleMusic()">🎵 Pornește Colinde</button>
        </div>
        <div class="row">
            <button class="btn-test" onclick="spawnOrnaments(6)">+ Adaugă Globuri</button>
            <button class="btn-gift" onclick="spawnGiantGift()">🎁 Cadou VIP</button>
        </div>
        <div id="status">Conectează Live-ul sau pornește muzica!</div>
    </div>

    <div class="bottom-banner">
        ✨ TAP-TAP & CADOURI = ÎMPODOBEȘTE BRADUL 3D MAGIC! ✨
    </div>
</div>

<audio id="festive-music" preload="auto" loop>
    <source src="https://actions.google.com/sounds/v1/holidays/christmas_pudding.ogg" type="audio/ogg">
</audio>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width, height;
    function resize() {
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Zăpadă strălucitoare 3D
    const snowflakes = [];
    for (let i = 0; i < 70; i++) {
        snowflakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 3 + 0.8,
            speed: Math.random() * 1.5 + 0.5,
            opacity: Math.random() * 0.8 + 0.2
        });
    }

    const ornaments = [];
    const maxOrnaments = 55;

    class Ornament {
        constructor(userId, nickname, avatarUrl, points) {
            this.userId = userId;
            this.nickname = nickname || 'Guest';
            this.points = points;
            this.img = null;
            this.imgLoaded = false;

            if (avatarUrl) {
                const image = new Image();
                image.crossOrigin = "Anonymous";
                image.src = avatarUrl;
                image.onload = () => { this.img = image; this.imgLoaded = true; };
            }
            this.assignPosition();
        }

        assignPosition() {
            // Poziționare pe volumul conic al bradului 3D
            const topY = height * 0.25;
            const bottomY = height * 0.77;
            this.relY = Math.random(); // 0 sus, 1 jos
            this.y = topY + this.relY * (bottomY - topY);

            const maxWidthAtY = this.relY * (width * 0.34) + 10;
            this.x = (width / 2) + (Math.random() - 0.5) * maxWidthAtY * 2;
            this.radius = 22 + Math.min(16, this.points / 100);
            this.color = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6'][Math.floor(Math.random() * 6)];
        }

        draw() {
            ctx.save();

            // Halou luminos puternic în spatele globului 3D
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(253, 224, 71, 0.4)';
            ctx.fill();

            // Cârlig/Sfoară argintie lucioasă
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.radius);
            ctx.lineTo(this.x, this.y - this.radius - 12);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Globul 3D cu efect de sferă lucioasă
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.save();
            ctx.clip();

            if (this.imgLoaded && this.img) {
                ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            } else {
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(11, this.radius * 0.7)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.nickname.substring(0, 2).toUpperCase(), this.x, this.y);
            }

            // Luciu sferic (efect 3D de sticlă)
            const specular = ctx.createRadialGradient(
                this.x - this.radius * 0.35, this.y - this.radius * 0.35, 2,
                this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.9
            );
            specular.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
            specular.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
            specular.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
            ctx.fillStyle = specular;
            ctx.fill();
            ctx.restore();

            // Contur auriu premium
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Nume elegant dedesubt
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.95)';
            ctx.shadowBlur = 6;
            ctx.fillText(this.nickname.substring(0, 10), this.x, this.y + this.radius + 14);

            ctx.restore();
        }
    }

    function draw3DTree() {
        const cx = width / 2;
        const time = Date.now() * 0.003;

        // 1. Steaua 3D spectaculoasă din vârf
        ctx.save();
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 35 + Math.sin(time * 2) * 15;
        ctx.font = '50px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⭐', cx, height * 0.15);
        ctx.restore();

        // 2. Trunchiul 3D cu textură de lemn masiv
        ctx.fillStyle = '#52250a';
        ctx.beginPath();
        ctx.roundRect(cx - 22, height * 0.77, 44, 45, 8);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 3. Straturile volumetrice ale bradului (Aspect 3D conic, curbat, cu lumini laterale)
        const levels = [
            { top: height * 0.19, mid: height * 0.32, bottom: height * 0.44, w: width * 0.27, col1: '#064e3b', col2: '#059669', col3: '#047857' },
            { top: height * 0.40, mid: height * 0.51, bottom: height * 0.62, w: width * 0.37, col1: '#065f46', col2: '#10b981', col3: '#059669' },
            { top: height * 0.58, mid: height * 0.68, bottom: height * 0.78, w: width * 0.48, col1: '#022c22', col2: '#047857', col3: '#065f46' }
        ];

        levels.forEach((lvl) => {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
            ctx.shadowBlur = 20;

            // Formă curbată 3D pentru fiecare nivel al coroanei
            ctx.beginPath();
            ctx.moveTo(cx, lvl.top);
            ctx.bezierCurveTo(cx + lvl.w * 0.5, lvl.mid, cx + lvl.w, lvl.bottom, cx + lvl.w * 0.95, lvl.bottom);
            ctx.lineTo(cx - lvl.w * 0.95, lvl.bottom);
            ctx.bezierCurveTo(cx - lvl.w, lvl.bottom, cx - lvl.w * 0.5, lvl.mid, cx, lvl.top);
            ctx.closePath();

            // Gradient lateral pentru volum 3D real (lumină din stânga/dreapta)
            const grad = ctx.createLinearGradient(cx - lvl.w, 0, cx + lvl.w, 0);
            grad.addColorStop(0, lvl.col1);
            grad.addColorStop(0.3, lvl.col2);
            grad.addColorStop(0.7, lvl.col2);
            grad.addColorStop(1, lvl.col3);
            ctx.fillStyle = grad;
            ctx.fill();

            // Contur festiv luminos
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        });

        // 4. Ghirlande de lumini neon colorate care pulsează
        const lights = [
            {x: cx, y: height * 0.27}, {x: cx - 35, y: height * 0.42}, {x: cx + 40, y: height * 0.40},
            {x: cx - 65, y: height * 0.56}, {x: cx + 60, y: height * 0.54}, {x: cx, y: height * 0.50},
            {x: cx - 90, y: height * 0.69}, {x: cx + 85, y: height * 0.67}, {x: cx - 30, y: height * 0.63}, {x: cx + 30, y: height * 0.64}
        ];
        lights.forEach((lt, idx) => {
            ctx.beginPath();
            ctx.arc(lt.x, lt.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = (idx % 2 === 0 && Math.sin(time * 3 + idx) > 0) ? '#fde047' : '#ff3b30';
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 15;
            ctx.fill();
        });
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        // Zăpadă 3D în cădere
        ctx.fillStyle = '#ffffff';
        snowflakes.forEach(sf => {
            ctx.globalAlpha = sf.opacity;
            ctx.beginPath();
            ctx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2);
            ctx.fill();
            sf.y += sf.speed;
            if (sf.y > height) sf.y = 0;
        });
        ctx.globalAlpha = 1.0;

        // Desenare Brad 3D Spectaculos
        draw3DTree();

        // Desenare Globuri cu poze de profil
        ornaments.forEach(o => o.draw());

        requestAnimationFrame(animate);
    }

    socket.on('tree-action', (data) => {
        addOrUpdateOrnament(data.userId, data.nickname, data.avatar, data.points);
    });

    socket.on('status-update', (data) => {
        const st = document.getElementById('status');
        if (data.connected) {
            st.style.color = '#4ade80';
            st.textContent = `🟢 Conectat la @${data.username}`;
        } else {
            st.style.color = '#fbbf24';
            st.textContent = `🟡 ${data.error}`;
        }
    });

    function addOrUpdateOrnament(userId, nickname, avatar, pts) {
        let existing = ornaments.find(o => o.userId === userId);
        if (existing) {
            existing.points += pts;
        } else {
            if (ornaments.length >= maxOrnaments) ornaments.shift();
            ornaments.push(new Ornament(userId, nickname, avatar, pts));
        }
    }

    function connectTikTok() {
        const user = document.getElementById('username').value.trim();
        if (!user) return;
        socket.emit('connect-tiktok', user);
    }

    function toggleControls() {
        document.getElementById('controls').classList.toggle('hidden');
    }

    let musicPlaying = false;
    function toggleMusic() {
        const audio = document.getElementById('festive-music');
        const btn = document.getElementById('music-btn');
        if (musicPlaying) {
            audio.pause();
            musicPlaying = false;
            btn.textContent = '🎵 Pornește Colinde';
            btn.style.background = '#8b5cf6';
        } else {
            audio.play().then(() => {
                musicPlaying = true;
                btn.textContent = '🔇 Oprește Colinde';
                btn.style.background = '#ef4444';
            }).catch(e => {
                alert("Atinge ecranul o dată, apoi apasă din nou pe colinde!");
            });
        }
    }

    const sampleNames = ["Andrei", "Maria", "Alex", "Elena", "Denis", "Ioana", "Vlad", "Bianca", "Cristi", "Teo"];
    function spawnOrnaments(count) {
        for (let i = 0; i < count; i++) {
            const name = sampleNames[Math.floor(Math.random() * sampleNames.length)] + Math.floor(Math.random()*99);
            addOrUpdateOrnament('test_' + Math.random(), name, null, Math.floor(Math.random() * 250) + 30);
        }
    }
    function spawnGiantGift() {
        addOrUpdateOrnament('vip_gift', '🎅 Moș Crăciun', null, 2000);
    }

    spawnOrnaments(9);
    animate();
</script>
</body>
</html>
