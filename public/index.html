<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bradul de Crăciun TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #020617;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 540px;
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #090d16 60%, #020617 100%);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
        /* Zăpadă pe fundal */
        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(105vh) translateX(20px); }
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        /* Meniul de setări */
        #controls {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.3s ease;
        }
        #controls.hidden { transform: translateY(-140%); }
        .row { display: flex; gap: 6px; justify-content: center; align-items: center; }
        input {
            background: #020617;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            width: 140px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .btn-connect { background: #ef4444; }
        .btn-test { background: #10b981; }
        .btn-gift { background: #f59e0b; color: #000; }
        .btn-music { background: #8b5cf6; }
        #status { font-size: 11px; color: #94a3b8; text-align: center; }
        
        #toggle-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 11;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .bottom-title {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 5;
            color: #f87171;
            font-weight: 900;
            font-size: 14px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Generare zăpadă -->
    <script>
        for(let i=0; i<45; i++) {
            let sf = document.createElement('div');
            sf.className = 'snowflake';
            sf.style.left = Math.random() * 100 + 'vw';
            sf.style.top = -Math.random() * 20 + 'vh';
            let size = Math.random() * 4 + 2;
            sf.style.width = size + 'px';
            sf.style.height = size + 'px';
            sf.style.animationDuration = (Math.random() * 3 + 2) + 's';
            sf.style.animationDelay = (Math.random() * 5) + 's';
            document.getElementById('game-container').appendChild(sf);
        }
    </script>

    <canvas id="treeCanvas"></canvas>

    <button id="toggle-ui" onclick="toggleControls()">🎄</button>

    <div id="controls">
        <div class="row">
            <input type="text" id="username" value="eusebiusebisebi" placeholder="User TikTok">
            <button class="btn-connect" onclick="connectTikTok()">Conectează</button>
            <button class="btn-music" onclick="toggleMusic()">🎵 Muzică</button>
        </div>
        <div class="row">
            <button class="btn-test" onclick="testOrnaments(5)">+ Adaugă Globuri</button>
            <button class="btn-gift" onclick="testGift()">🎁 Cadou Brad</button>
        </div>
        <div id="status">Conectează Live-ul sau testează decorațiunile!</div>
    </div>

    <div class="bottom-title">
        ✨ TAP-TAP & CADOURI = ÎMPODOBEȘTE BRADUL DE CRĂCIUN! ✨
    </div>
</div>

<!-- Audio Crăciun (Melodie fundal gratuită de pe web) -->
<audio id="bg-music" loop>
    <source src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Jingle_Bells_%28instrumental%29.ogg" type="audio/ogg">
</audio>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width, height;
    function resize() {
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Colecția de decorațiuni din brad
    const ornaments = [];
    const maxOrnaments = 45; // Număr maxim în brad vizibile frumos

    class Ornament {
        constructor(userId, nickname, avatarUrl, points) {
            this.userId = userId;
            this.nickname = nickname || 'Guest';
            this.points = points;
            this.img = null;
            this.imgLoaded = false;

            if (avatarUrl) {
                const image = new Image();
                image.crossOrigin = "Anonymous";
                image.src = avatarUrl;
                image.onload = () => {
                    this.img = image;
                    this.imgLoaded = true;
                };
            }

            this.assignPosition();
        }

        assignPosition() {
            // Distribuție triunghiulară în interiorul bradului
            // Vârful bradului este sus, baza jos
            const treeTopY = height * 0.22;
            const treeBottomY = height * 0.76;
            
            // Alegem o înălțime aleatorie pe brad
            this.relY = Math.random(); // 0 = sus, 1 = jos
            this.y = treeTopY + this.relY * (treeBottomY - treeTopY);

            // Lățimea bradului la această înălțime
            const maxWidthAtY = this.relY * (width * 0.38) + 15;
            this.x = (width / 2) + (Math.random() - 0.5) * maxWidthAtY * 2;
            
            this.radius = 22 + Math.min(12, this.points / 100);
            this.color = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#ec4899'][Math.floor(Math.random() * 5)];
        }

        draw() {
            ctx.save();
            
            // Strălucire glob
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.fill();

            // Sfoară glob
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.radius);
            ctx.lineTo(this.x, this.y - this.radius - 8);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Glob / Cadou circular cu poză
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.save();
            ctx.clip();

            if (this.imgLoaded && this.img) {
                ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            } else {
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(10, this.radius * 0.7)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.nickname.substring(0, 2).toUpperCase(), this.x, this.y);
            }
            ctx.restore();

            // Contur festiv
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Nume scurt sub glob
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(this.nickname.substring(0, 8), this.x, this.y + this.radius + 12);

            ctx.restore();
        }
    }

    function drawTree() {
        const cx = width / 2;
        
        // Steaua din vârful bradului
        ctx.font = '36px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⭐', cx, height * 0.17);

        // Trunchiul bradului
        ctx.fillStyle = '#78350f';
        ctx.fillRect(cx - 18, height * 0.75, 36, 45);

        // Straturile verzi ale bradului (triunghiuri suprapuse)
        const layers = [
            { topY: height * 0.20, bottomY: height * 0.42, w: width * 0.24 },
            { topY: height * 0.38, bottomY: height * 0.60, w: width * 0.34 },
            { topY: height * 0.56, bottomY: height * 0.76, w: width * 0.44 }
        ];

        layers.forEach((l, index) => {
            ctx.beginPath();
            ctx.moveTo(cx, l.topY);
            ctx.lineTo(cx + l.w, l.bottomY);
            ctx.lineTo(cx - l.w, l.bottomY);
            ctx.closePath();
            
            // Gradient verde festiv
            const grad = ctx.createLinearGradient(cx - l.w, 0, cx + l.w, 0);
            grad.addColorStop(0, '#065f46');
            grad.addColorStop(0.5, '#059669');
            grad.addColorStop(1, '#047857');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3;
            ctx.stroke();
        });

        // Luminițe licăritoare pe brad
        const time = Date.now() * 0.003;
        const lights = [
            {x: cx, y: height * 0.30}, {x: cx - 25, y: height * 0.45}, {x: cx + 30, y: height * 0.42},
            {x: cx - 50, y: height * 0.58}, {x: cx + 45, y: height * 0.55}, {x: cx, y: height * 0.52},
            {x: cx - 75, y: height * 0.70}, {x: cx + 70, y: height * 0.68}, {x: cx - 20, y: height * 0.65}
        ];
        lights.forEach((lt, idx) => {
            ctx.beginPath();
            ctx.arc(lt.x, lt.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = (idx % 2 === 0 && Math.sin(time + idx) > 0) ? '#fde047' : '#ef4444';
            ctx.fill();
        });
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        // Desenăm bradul
        drawTree();

        // Desenăm toate globurile / cadourile din brad
        ornaments.forEach(o => o.draw());

        requestAnimationFrame(animate);
    }

    // Gestionare acțiuni live TikTok
    socket.on('tree-action', (data) => {
        addOrUpdateOrnament(data.userId, data.nickname, data.avatar, data.points);
    });

    socket.on('status-update', (data) => {
        const st = document.getElementById('status');
        if (data.connected) {
            st.style.color = '#4ade80';
            st.textContent = `🟢 Conectat la @${data.username}`;
        } else {
            st.style.color = '#fbbf24';
            st.textContent = `🟡 ${data.error}`;
        }
    });

    function addOrUpdateOrnament(userId, nickname, avatar, pts) {
        let existing = ornaments.find(o => o.userId === userId);
        if (existing) {
            existing.points += pts;
        } else {
            if (ornaments.length >= maxOrnaments) {
                ornaments.shift(); // scoatem cel mai vechi glob
            }
            ornaments.push(new Ornament(userId, nickname, avatar, pts));
        }
    }

    function connectTikTok() {
        const user = document.getElementById('username').value.trim();
        if (!user) return;
        document.getElementById('status').textContent = `Se conectează la @${user}...`;
        socket.emit('connect-username', user); // corectat trimiterea în server
        socket.emit('connect-tiktok', user);
    }

    function toggleControls() {
        document.getElementById('controls').classList.toggle('hidden');
    }

    // Muzică de Crăciun Play/Pause
    let musicPlaying = false;
    function toggleMusic() {
        const audio = document.getElementById('bg-music');
        if (musicPlaying) {
            audio.pause();
            musicPlaying = false;
        } else {
            audio.play().catch(e => console.log("Eroare redare audio:", e));
            musicPlaying = true;
        }
    }

    // Funcții de Test / Simulare
    const testNames = ["Andrei", "Maria", "Alex", "Elena", "Denis", "Ioana", "Vlad", "Bianca", "Cristi", "Teo"];
    function testOrnaments(count) {
        for (let i = 0; i < count; i++) {
            const name = testNames[Math.floor(Math.random() * testNames.length)] + Math.floor(Math.random()*90);
            addOrUpdateOrnament('user_' + Math.random(), name, null, Math.floor(Math.random() * 200) + 20);
        }
    }
    function testGift() {
        addOrUpdateOrnament('gift_vip', 'Moș Crăciun', null, 1500);
    }

    // Populăm bradul la început cu câțiva spectatori test
    testOrnaments(6);
    animate();
</script>
</body>
</html>
