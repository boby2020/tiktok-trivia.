<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Bubble Battle Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #050814;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        /* Container vertical 9:16 optimizat pentru telefon */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 540px;
            background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 55%, #020617 100%);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        /* Fundal stil neon oraș / logo subtil */
        .bg-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 1;
            opacity: 0.22;
        }
        .bg-watermark h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: -3px -3px 0 #00f2fe, 3px 3px 0 #fe0979;
        }
        .bg-watermark p {
            font-size: 18px;
            color: #38bdf8;
            font-weight: bold;
            margin-top: 6px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        /* Bara de control sus (se poate ascunde) */
        #controls {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.3s ease;
        }
        #controls.hidden {
            transform: translateY(-130%);
        }
        .row {
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: center;
        }
        input {
            background: #020617;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            width: 140px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .btn-connect { background: #ec4899; }
        .btn-demo { background: #2563eb; }
        .btn-gift { background: #f59e0b; color: #000; }
        .btn-reset { background: #475569; }
        #status {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }
        /* Buton discret pentru a ascunde/arăta meniul pe live */
        #toggle-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 11;
            background: rgba(0,0,0,0.45);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Legenda de jos */
        .bottom-legend {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            z-index: 5;
            text-align: center;
            pointer-events: none;
            font-size: 13px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="bg-watermark">
        <h1>TIKTOK<br>ARENA</h1>
        <p>TAP-TAP & CADOURI = PUTERE</p>
    </div>

    <canvas id="arena"></canvas>

    <button id="toggle-ui" onclick="toggleControls()" title="Ascunde/Arată meniul">⚙️</button>

    <div id="controls">
        <div class="row">
            <input type="text" id="username" value="eusebiusebisebi" placeholder="User TikTok">
            <button class="btn-connect" onclick="connectTikTok()">Conectează</button>
            <button class="btn-reset" onclick="resetArena()">Reset</button>
        </div>
        <div class="row">
            <button class="btn-demo" onclick="spawnBots(15)">+15 Jucători</button>
            <button class="btn-demo" onclick="boostRandom('like')">❤️ Tap-Tap</button>
            <button class="btn-gift" onclick="boostRandom('gift')">🎁 Cadou Mare</button>
        </div>
        <div id="status">Apasă ❤️ sau 🎁 pentru test, sau conectează Live-ul!</div>
    </div>

    <div class="bottom-legend">
        ❤️ TAP-TAP = CREȘTI &nbsp;|&nbsp; 🎁 CADOU = EXPLODEZI ÎN FORȚĂ
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById('arena');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width, height;
    function resize() {
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Structura jucătorilor: Map userId -> Bubble
    const bubbles = new Map();
    const shockwaves = [];
    const floatingTexts = [];

    const ringColors = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#a855f7', '#06b6d4'];

    function formatPoints(pts) {
        if (pts >= 1000000) return (pts / 1000000).toFixed(1).replace('.0', '') + 'M';
        if (pts >= 1000) return (pts / 1000).toFixed(1).replace('.0', '') + 'K';
        return Math.floor(pts).toString();
    }

    function getRadiusFromPoints(pts) {
        // Rază minimă 18px, maximă 78px pe mobil
        const r = 18 + Math.sqrt(pts) * 0.95;
        return Math.min(78, Math.max(18, r));
    }

    class Bubble {
        constructor(userId, nickname, avatarUrl, points = 10) {
            this.userId = userId;
            this.nickname = nickname || 'Player';
            this.points = points;
            this.radius = getRadiusFromPoints(points);
            this.targetRadius = this.radius;

            this.x = Math.random() * (width - 80) + 40;
            this.y = Math.random() * (height - 160) + 80;
            this.vx = (Math.random() - 0.5) * 3.5;
            this.vy = (Math.random() - 0.5) * 3.5;

            this.color = ringColors[Math.floor(Math.random() * ringColors.length)];
            this.glowTimer = 0;
            this.img = null;
            this.imgLoaded = false;

            if (avatarUrl) {
                const image = new Image();
                image.crossOrigin = "Anonymous";
                image.src = avatarUrl;
                image.onload = () => {
                    this.img = image;
                    this.imgLoaded = true;
                };
            }
        }

        addPoints(pts, isGift = false) {
            this.points += pts;
            this.targetRadius = getRadiusFromPoints(this.points);
            this.glowTimer = isGift ? 90 : 25;

            if (isGift) {
                // Undă de șoc care împinge bulele din jur
                shockwaves.push({
                    x: this.x,
                    y: this.y,
                    radius: this.radius,
                    maxRadius: this.radius + 140,
                    alpha: 1,
                    color: '#fde047'
                });

                bubbles.forEach(other => {
                    if (other.userId === this.userId) return;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 180 && dist > 0) {
                        const force = (180 - dist) / 18;
                        other.vx += (dx / dist) * force;
                        other.vy += (dy / dist) * force;
                    }
                });
            }

            // Text plutitor (+15, +500 etc.)
            if (pts >= 15) {
                floatingTexts.push({
                    x: this.x,
                    y: this.y - this.radius,
                    text: `+${formatPoints(pts)}`,
                    alpha: 1,
                    color: isGift ? '#fde047' : '#38bdf8'
                });
            }
        }

        update() {
            // Tranziție lină la mărime
            this.radius += (this.targetRadius - this.radius) * 0.12;
            if (this.glowTimer > 0) this.glowTimer--;

            // Mișcare ușoară continuă (să nu stea pe loc)
            this.vx += (Math.random() - 0.5) * 0.12;
            this.vy += (Math.random() - 0.5) * 0.12;

            // Limitare viteză maximă
            const speed = Math.hypot(this.vx, this.vy);
            const maxSpeed = 4.2;
            if (speed > maxSpeed) {
                this.vx = (this.vx / speed) * maxSpeed;
                this.vy = (this.vy / speed) * maxSpeed;
            }

            this.x += this.vx;
            this.y += this.vy;

            // Ricoșeu din pereții ecranului
            const topMargin = 45;
            const bottomMargin = 38;
            if (this.x - this.radius < 4) {
                this.x = this.radius + 4;
                this.vx = Math.abs(this.vx) * 0.9;
            } else if (this.x + this.radius > width - 4) {
                this.x = width - this.radius - 4;
                this.vx = -Math.abs(this.vx) * 0.9;
            }

            if (this.y - this.radius < topMargin) {
                this.y = this.radius + topMargin;
                this.vy = Math.abs(this.vy) * 0.9;
            } else if (this.y + this.radius > height - bottomMargin) {
                this.y = height - this.radius - bottomMargin;
                this.vy = -Math.abs(this.vy) * 0.9;
            }
        }

        draw(isLeader) {
            ctx.save();

            // Aură strălucitoare pentru lider sau când primește cadou
            if (isLeader || this.glowTimer > 0) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
                ctx.fillStyle = isLeader ? 'rgba(250, 204, 21, 0.35)' : 'rgba(56, 189, 248, 0.35)';
                ctx.fill();
            }

            // Decupaj circular pentru poză
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.save();
            ctx.clip();

            if (this.imgLoaded && this.img) {
                ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            } else {
                // Fundal colorat cu inițiala dacă nu are poză
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(12, this.radius * 0.75)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.nickname.substring(0, 2).toUpperCase(), this.x, this.y - 3);
            }

            // Umbră jos pe bulă pentru lizibilitatea scorului
            const grad = ctx.createLinearGradient(0, this.y, 0, this.y + this.radius);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = grad;
            ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            ctx.restore();

            // Contur exterior colorat (gros pentru lideri)
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.lineWidth = isLeader ? 4 : 2.5;
            ctx.strokeStyle = isLeader ? '#fde047' : (this.glowTimer > 0 ? '#ffffff' : this.color);
            ctx.stroke();

            // Afișare scor (ex: 3.4K) exact ca în clip
            const scoreStr = formatPoints(this.points);
            const fontSize = Math.max(10, Math.min(20, this.radius * 0.42));
            ctx.font = `900 ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Pastilă neagră în spatele scorului
            const textW = ctx.measureText(scoreStr).width + 8;
            const pillH = fontSize + 4;
            const pillY = this.y + this.radius * 0.42;

            ctx.fillStyle = isLeader ? '#dc2626' : 'rgba(15, 23, 42, 0.88)';
            ctx.beginPath();
            ctx.roundRect(this.x - textW / 2, pillY - pillH / 2, textW, pillH, 6);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillText(scoreStr, this.x, pillY + 1);

            // Coroană pentru locul 1
            if (isLeader) {
                ctx.font = `${Math.max(16, this.radius * 0.45)}px sans-serif`;
                ctx.fillText('👑', this.x, this.y - this.radius - 6);
            }

            ctx.restore();
        }
    }

    // Fizica de ciocnire elastică între toate bulele
    function resolveCollisions() {
        const list = Array.from(bubbles.values());
        for (let i = 0; i < list.length; i++) {
            for (let j = i + 1; j < list.length; j++) {
                const a = list[i];
                const b = list[j];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.hypot(dx, dy);
                const minDist = a.radius + b.radius + 2;

                if (dist < minDist && dist > 0) {
                    // Separare ca să nu se suprapună
                    const overlap = (minDist - dist) / 2;
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // Masa proporțională cu raza (bulele mari împing mai tare!)
                    const massA = a.radius * a.radius;
                    const massB = b.radius * b.radius;
                    const totalMass = massA + massB;

                    a.x -= nx * overlap * (massB / totalMass) * 2;
                    a.y -= ny * overlap * (massB / totalMass) * 2;
                    b.x += nx * overlap * (massA / totalMass) * 2;
                    b.y += ny * overlap * (massA / totalMass) * 2;

                    // Schimb de impuls la ciocnire
                    const rvx = b.vx - a.vx;
                    const rvy = b.vy - a.vy;
                    const velAlongNormal = rvx * nx + rvy * ny;

                    if (velAlongNormal < 0) {
                        const restitution = 0.85;
                        const impulse = -(1 + restitution) * velAlongNormal / (1 / massA + 1 / massB);
                        a.vx -= (impulse / massA) * nx;
                        a.vy -= (impulse / massA) * ny;
                        b.vx += (impulse / massB) * nx;
                        b.vy += (impulse / massB) * ny;
                    }
                }
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        // Găsim liderul (cea mai mare bulă)
        let leaderId = null;
        let maxPts = -1;
        bubbles.forEach((b, id) => {
            if (b.points > maxPts) {
                maxPts = b.points;
                leaderId = id;
            }
        });

        // Actualizăm și rezolvăm ciocnirile
        bubbles.forEach(b => b.update());
        resolveCollisions();

        // Desenăm undele de șoc
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            const sw = shockwaves[i];
            sw.radius += 5;
            sw.alpha -= 0.03;
            if (sw.alpha <= 0) {
                shockwaves.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.beginPath();
            ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(253, 224, 71, ${sw.alpha})`;
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        }

        // Desenăm bulele (liderul ultimul ca să fie deasupra)
        bubbles.forEach((b, id) => {
            if (id !== leaderId) b.draw(false);
        });
        if (leaderId && bubbles.has(leaderId)) {
            bubbles.get(leaderId).draw(true);
        }

        // Textele plutitoare (+500 etc.)
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            const ft = floatingTexts[i];
            ft.y -= 1.2;
            ft.alpha -= 0.025;
            if (ft.alpha <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.font = '900 16px sans-serif';
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = ft.alpha;
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }

        requestAnimationFrame(animate);
    }

    // Evenimente primite de la serverul TikTok
    socket.on('bubble-action', (data) => {
        handlePlayerAction(data.userId, data.nickname, data.avatar, data.points, data.type === 'gift');
    });

    socket.on('status-update', (data) => {
        const st = document.getElementById('status');
        if (data.connected) {
            st.style.color = '#4ade80';
            st.textContent = `🟢 Conectat LIVE la @${data.username}`;
        } else {
            st.style.color = '#fbbf24';
            st.textContent = `🟡 ${data.error}`;
        }
    });

    function handlePlayerAction(userId, nickname, avatar, points, isGift) {
        if (!bubbles.has(userId)) {
            // Limităm la 90 de bule simultane pentru performanță fluidă pe telefon
            if (bubbles.size >= 90) {
                // Eliminăm cea mai mică bulă ca să facem loc
                let smallestId = null;
                let minPts = Infinity;
                bubbles.forEach((b, id) => {
                    if (b.points < minPts) {
                        minPts = b.points;
                        smallestId = id;
                    }
                });
                if (smallestId) bubbles.delete(smallestId);
            }
            bubbles.set(userId, new Bubble(userId, nickname, avatar, points));
        } else {
            bubbles.get(userId).addPoints(points, isGift);
        }
    }

    function connectTikTok() {
        const user = document.getElementById('username').value.trim();
        if (!user) return;
        document.getElementById('status').textContent = `Se conectează la @${user}...`;
        socket.emit('connect-tiktok', user);
    }

    function toggleControls() {
        document.getElementById('controls').classList.toggle('hidden');
    }

    function resetArena() {
        bubbles.clear();
    }

    // Funcții de test / animare a ecranului
    const sampleNames = ["Andrei", "Maria", "Alex", "Elena", "Denis", "Ioana", "Vlad", "Bianca", "Seby", "Gabi", "Cristi", "Daria", "Mihai", "Teo", "Raul"];
    function spawnBots(count) {
        for (let i = 0; i < count; i++) {
            const id = 'bot_' + Math.floor(Math.random() * 100000);
            const name = sampleNames[Math.floor(Math.random() * sampleNames.length)];
            const startPts = Math.floor(Math.random() * 150) + 10;
            handlePlayerAction(id, name, null, startPts, false);
        }
    }

    function boostRandom(type) {
        if (bubbles.size === 0) spawnBots(12);
        const keys = Array.from(bubbles.keys());
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        const b = bubbles.get(randomKey);
        if (type === 'gift') {
            b.addPoints(Math.floor(Math.random() * 900) + 300, true);
        } else {
            b.addPoints(Math.floor(Math.random() * 40) + 15, false);
        }
    }

    // Pornim cu 18 jucători în arenă ca să arate spectaculos din prima secundă
    spawnBots(18);
    animate();
</script>
</body>
</html>
