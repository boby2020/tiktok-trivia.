<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zidul Penitenciarului - Joc Interactiv TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #05070a;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 540px;
            background: #0b0f17;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.95);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #controls.hidden { transform: translateY(-170%); }
        .row { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
        input {
            background: #020617;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 13px;
            width: 135px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn-connect { background: #ec4899; }
        .btn-voice { background: #3b82f6; }
        .btn-test { background: #10b981; }
        .btn-gift { background: #f59e0b; color: #000; }
        #status { font-size: 11px; color: #94a3b8; text-align: center; }

        #toggle-ui {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 11;
            background: rgba(0,0,0,0.65);
            color: #38bdf8;
            border: 1px solid rgba(56,189,248,0.5);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .bottom-banner {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 5;
            color: #fde047;
            font-weight: 900;
            font-size: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.95);
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="wallCanvas"></canvas>

    <button id="toggle-ui" onclick="toggleControls()">⚙️</button>

    <div id="controls">
        <div class="row">
            <input type="text" id="username" value="eusebiusebisebi" placeholder="User TikTok">
            <button class="btn-connect" onclick="connectTikTok()">Conectează</button>
            <button class="btn-voice" id="voice-btn" onclick="toggleVoice()">🔊 Voce RO: PORNITĂ</button>
        </div>
        <div class="row">
            <button class="btn-test" onclick="testViewer()">+ Intrare Spectator</button>
            <button class="btn-gift" onclick="testGift()">🎁 Cadou Mare</button>
        </div>
        <div id="status">Atinge ecranul o dată pentru sunet și voce!</div>
    </div>

    <div class="bottom-banner">
        💥 INTRĂ PE LIVE / TAP-TAP / CADOURI = APARI PE ZID! 💥
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById('wallCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width, height;
    function resize() {
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- SISTEM AUDIO & VOCE ÎN LIMBA ROMÂNĂ ---
    let voiceEnabled = true;
    const speechQueue = [];
    let isSpeaking = false;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function unlockAudio() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click', unlockAudio, { once: true });

    function playLaserOrSpraySound() {
        try {
            unlockAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(520, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        } catch (e) {}
    }

    function speakRomanian(text) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        speechQueue.push(text);
        processSpeechQueue();
    }

    function processSpeechQueue() {
        if (isSpeaking || speechQueue.length === 0) return;
        isSpeaking = true;
        const text = speechQueue.shift();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ro-RO';
        utterance.rate = 1.05;
        utterance.pitch = 1.05;

        const voices = window.speechSynthesis.getVoices();
        const roVoice = voices.find(v => v.lang.includes('ro'));
        if (roVoice) utterance.voice = roVoice;

        utterance.onend = () => {
            isSpeaking = false;
            processSpeechQueue();
        };
        utterance.onerror = () => {
            isSpeaking = false;
            processSpeechQueue();
        };
        window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        const btn = document.getElementById('voice-btn');
        if (voiceEnabled) {
            btn.textContent = '🔊 Voce RO: PORNITĂ';
            btn.style.background = '#3b82f6';
            speakRomanian('Vocea a fost pornită!');
        } else {
            btn.textContent = '🔇 Voce RO: OPRITĂ';
            btn.style.background = '#64748b';
            window.speechSynthesis.cancel();
            speechQueue.length = 0;
            isSpeaking = false;
        }
    }

    // --- GRAFICA ZIDULUI DE PENITENCIAR ---
    const paintSplatters = [];
    const targets = [];
    const beams = [];
    const maxTargets = 16;

    const neonColors = ['#ff0055', '#00f0ff', '#fde047', '#10b981', '#a855f7', '#f97316'];

    function drawPrisonEnvironment() {
        // 1. Cerul nopții cu tentă albastru-închis
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.25);
        skyGrad.addColorStop(0, '#020617');
        skyGrad.addColorStop(1, '#1e3a8a');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height * 0.25);

        // 2. Turn de pază în dreapta sus + reflector
        const towerX = width * 0.80;
        const towerY = height * 0.08;
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(towerX - 18, towerY + 25, 36, height * 0.16);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(towerX - 24, towerY, 48, 28);
        // Fereastră luminată turn
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(towerX - 16, towerY + 6, 32, 12);

        // Fascicul reflector din turn
        ctx.save();
        const beamGrad = ctx.createLinearGradient(towerX, towerY + 12, width * 0.3, height * 0.6);
        beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
        beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(towerX, towerY + 12);
        ctx.lineTo(width * 0.1, height * 0.65);
        ctx.lineTo(width * 0.65, height * 0.65);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 3. Zidul masiv de beton cu textură uzată
        const wallTop = height * 0.22;
        const wallBottom = height * 0.72;
        const wallGrad = ctx.createLinearGradient(0, wallTop, 0, wallBottom);
        wallGrad.addColorStop(0, '#475569');
        wallGrad.addColorStop(0.5, '#334155');
        wallGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, wallTop, width, wallBottom - wallTop);

        // Rosturi verticale între plăcile de beton ale zidului
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.5)';
        ctx.lineWidth = 2;
        for (let x = 40; x < width; x += 65) {
            ctx.beginPath();
            ctx.moveTo(x, wallTop);
            ctx.lineTo(x, wallBottom);
            ctx.stroke();
        }

        // 4. Sârmă ghimpată spiralată pe coama zidului
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        for (let x = 0; x < width + 20; x += 18) {
            ctx.beginPath();
            ctx.arc(x, wallTop - 8, 12, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 5. Două reflectoare puternice montate pe zid
        [width * 0.22, width * 0.78].forEach(lx => {
            ctx.save();
            const glow = ctx.createRadialGradient(lx, wallTop + 35, 4, lx, wallTop + 35, 95);
            glow.addColorStop(0, 'rgba(253, 224, 71, 0.95)');
            glow.addColorStop(0.3, 'rgba(245, 158, 11, 0.45)');
            glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(lx, wallTop + 35, 95, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fef9c3';
            ctx.beginPath();
            ctx.arc(lx, wallTop + 35, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 6. Asfaltul ud de jos cu reflexii colorate
        const floorGrad = ctx.createLinearGradient(0, wallBottom, 0, height);
        floorGrad.addColorStop(0, '#0f172a');
        floorGrad.addColorStop(1, '#020617');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, wallBottom, width, height - wallBottom);

        // Reflexii luminoase pe asfaltul ud
        paintSplatters.forEach(sp => {
            ctx.save();
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = sp.color;
            ctx.beginPath();
            ctx.ellipse(sp.x, wallBottom + (sp.y - wallTop) * 0.32, sp.radius * 0.9, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    // --- ȚINTELE (SPECTATORII CU VOPSEA NEON PE ZID) ---
    class WallTarget {
        constructor(userId, nickname, avatarUrl, points) {
            this.userId = userId;
            this.nickname = nickname || 'Spectator';
            this.points = points;
            this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
            this.img = null;
            this.imgLoaded = false;
            this.scale = 0.1;
            this.targetScale = 1.0;

            if (avatarUrl) {
                const image = new Image();
                image.crossOrigin = "Anonymous";
                image.src = avatarUrl;
                image.onload = () => { this.img = image; this.imgLoaded = true; };
            }
            this.assignSpot();
        }

        assignSpot() {
            const wallTop = height * 0.28;
            const wallBottom = height * 0.65;
            this.x = width * 0.16 + Math.random() * (width * 0.68);
            this.y = wallTop + Math.random() * (wallBottom - wallTop);
            this.radius = 26 + Math.min(18, this.points / 150);

            // Adaugă pată de vopsea pe zid în spate
            paintSplatters.push({
                x: this.x,
                y: this.y,
                radius: this.radius + 18,
                color: this.color,
                blobs: Array.from({ length: 10 }, () => ({
                    angle: Math.random() * Math.PI * 2,
                    dist: this.radius * (0.7 + Math.random() * 0.7),
                    r: 6 + Math.random() * 12
                }))
            });
            if (paintSplatters.length > 35) paintSplatters.shift();
        }

        draw() {
            this.scale += (this.targetScale - this.scale) * 0.18;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);

            // Pata de vopsea / explozie din spatele profilului
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 8; i++) {
                const ang = (i / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(Math.cos(ang) * (this.radius + 7), Math.sin(ang) * (this.radius + 7), 8, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Poza de profil circulară
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.save();
            ctx.clip();

            if (this.imgLoaded && this.img) {
                ctx.drawImage(this.img, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(13, this.radius * 0.65)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.nickname.substring(0, 2).toUpperCase(), 0, 0);
            }
            ctx.restore();

            // Contur alb strălucitor
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Etichetă nume stil joc (@Nume)
            const label = '@' + this.nickname.substring(0, 11);
            ctx.font = 'bold 11px sans-serif';
            const textW = ctx.measureText(label).width + 12;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
            ctx.beginPath();
            ctx.roundRect(-textW / 2, this.radius + 5, textW, 18, 6);
            ctx.fill();

            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, this.radius + 14);

            ctx.restore();
        }
    }

    // --- ARMA FUTURISTĂ / SPRAY-UL DIN PARTEA DE JOS ---
    let gunTargetX = width / 2;
    let gunTargetY = height * 0.45;
    let gunRecoil = 0;

    function drawWeaponAndBeams() {
        // Razele de vopsea/laser trase spre ținte
        for (let i = beams.length - 1; i >= 0; i--) {
            const b = beams[i];
            ctx.save();
            ctx.strokeStyle = b.color;
            ctx.lineWidth = b.life * 14;
            ctx.lineCap = 'round';
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 20;
            ctx.globalAlpha = b.life;
            ctx.beginPath();
            ctx.moveTo(b.startX, b.startY);
            ctx.lineTo(b.endX, b.endY);
            ctx.stroke();

            // Miez alb luminos al razei
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = b.life * 5;
            ctx.stroke();
            ctx.restore();

            b.life -= 0.06;
            if (b.life <= 0) beams.splice(i, 1);
        }

        // Poziția armei în stânga-jos (exact ca în videoclip)
        const baseX = width * 0.22;
        const baseY = height * 0.96;
        const angle = Math.atan2(gunTargetY - baseY, gunTargetX - baseX);

        gunRecoil *= 0.82;

        ctx.save();
        ctx.translate(baseX, baseY);
        ctx.rotate(angle);
        ctx.translate(-gunRecoil, 0);

        // Corpul armei neon roz/mov/metalic
        const gunGrad = ctx.createLinearGradient(0, -24, 150, 24);
        gunGrad.addColorStop(0, '#1e293b');
        gunGrad.addColorStop(0.5, '#ec4899');
        gunGrad.addColorStop(1, '#8b5cf6');
        ctx.fillStyle = gunGrad;
        ctx.beginPath();
        ctx.roundRect(0, -22, 145, 44, 12);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Țeava armei
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(140, -12, 24, 24);
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(160, -9, 6, 18);

        // Detalii mecanice pe armă
        ctx.fillStyle = '#fde047';
        ctx.fillRect(35, -14, 55, 8);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(45, 6, 65, 6);

        ctx.restore();
    }

    function fireAtTarget(target) {
        gunTargetX = target.x;
        gunTargetY = target.y;
        gunRecoil = 18;

        const baseX = width * 0.22;
        const baseY = height * 0.96;
        const angle = Math.atan2(gunTargetY - baseY, gunTargetX - baseX);
        const muzzleX = baseX + Math.cos(angle) * 155;
        const muzzleY = baseY + Math.sin(angle) * 155;

        beams.push({
            startX: muzzleX,
            startY: muzzleY,
            endX: target.x,
            endY: target.y,
            color: target.color,
            life: 1.0
        });

        playLaserOrSpraySound();
    }

    // Trage automat când atingi ecranul pe o țintă sau oriunde pe zid
    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        let hit = targets.find(t => Math.hypot(t.x - clickX, t.y - clickY) <= t.radius + 20);
        if (!hit && targets.length > 0) {
            hit = targets[Math.floor(Math.random() * targets.length)];
        }
        if (hit) {
            hit.scale = 1.35;
            fireAtTarget(hit);
        }
    });

    function animate() {
        ctx.clearRect(0, 0, width, height);
        drawPrisonEnvironment();
        targets.forEach(t => t.draw());
        drawWeaponAndBeams();
        requestAnimationFrame(animate);
    }

    // --- EVENIMENTE TIKTOK LIVE ---
    const greetedUsers = new Set();

    socket.on('wall-action', (data) => {
        handleViewerInteraction(data.userId, data.nickname, data.avatar, data.points, data.type);
    });

    socket.on('status-update', (data) => {
        const st = document.getElementById('status');
        if (data.connected) {
            st.style.color = '#4ade80';
            st.textContent = `🟢 Conectat la @${data.username}`;
            speakRomanian(`Conectat la live-ul lui ${data.username}. Bun venit tuturor!`);
        } else {
            st.style.color = '#fbbf24';
            st.textContent = `🟡 ${data.error}`;
        }
    });

    function handleViewerInteraction(userId, nickname, avatar, pts, type) {
        let existing = targets.find(t => t.userId === userId);
        if (existing) {
            existing.points += pts;
            existing.radius = Math.min(48, existing.radius + 3);
            existing.scale = 1.3;
            fireAtTarget(existing);
        } else {
            if (targets.length >= maxTargets) targets.shift();
            const newTarget = new WallTarget(userId, nickname, avatar, pts);
            targets.push(newTarget);
            fireAtTarget(newTarget);
        }

        // Vorbește în română când intră cineva nou sau trimite cadou
        if (type === 'gift') {
            speakRomanian(`Mulțumim pentru cadou, ${nickname}!`);
        } else if (!greetedUsers.has(userId)) {
            greetedUsers.add(userId);
            const salutari = [
                `Bună, ${nickname}! Bun venit pe live!`,
                `Salutare, ${nickname}! Bine ai venit!`,
                `Hello, ${nickname}! Bun venit pe zid!`
            ];
            const mesaj = salutari[Math.floor(Math.random() * salutari.length)];
            speakRomanian(mesaj);
        }
    }

    function connectTikTok() {
        unlockAudio();
        const user = document.getElementById('username').value.trim();
        if (!user) return;
        document.getElementById('status').textContent = `Se conectează la @${user}...`;
        socket.emit('connect-tiktok', user);
    }

    function toggleControls() {
        document.getElementById('controls').classList.toggle('hidden');
    }

    const demoNames = ["Andrei", "Maria", "Elena", "Denis", "Ioana", "Vlad", "Bianca", "Cristi", "Alex", "Raluca"];
    function testViewer() {
        unlockAudio();
        const name = demoNames[Math.floor(Math.random() * demoNames.length)];
        handleViewerInteraction('demo_' + Math.random(), name, null, 25, 'member');
    }

    function testGift() {
        unlockAudio();
        const name = demoNames[Math.floor(Math.random() * demoNames.length)];
        handleViewerInteraction('vip_' + Math.random(), name, null, 500, 'gift');
    }

    // Populare inițială cu 3 spectatori de exemplu
    setTimeout(() => {
        ['Andrei', 'Maria', 'Alex'].forEach(n => {
            const t = new WallTarget('init_' + n, n, null, 30);
            targets.push(t);
        });
    }, 300);

    animate();
</script>
</body>
</html>
