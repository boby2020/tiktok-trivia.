<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Trivia Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #ff0050; }
        .question { font-size: 22px; margin: 20px 0; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        button {
            background: #00f2fe;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            transition: 0.2s;
        }
        button:hover { background: #4facfe; color: #fff; }
        #result { margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Trivia Live 🎮</h1>
        <div id="question-container">
            <p class="question" id="question-text">Se încarcă întrebarea...</p>
            <div class="options" id="options-container"></div>
        </div>
        <div id="result"></div>
    </div>

    <!-- Scriptul Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const resultDiv = document.getElementById('result');

        socket.on('new-question', (q) => {
            resultDiv.textContent = '';
            questionText.textContent = q.question;
            optionsContainer.innerHTML = '';

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.textContent = option;
                btn.onclick = () => {
                    socket.emit('submit-answer', { optionIndex: index });
                };
                optionsContainer.appendChild(btn);
            });
        });

        socket.on('answer-result', (data) => {
            if (data.correct) {
                resultDiv.style.color = '#00ffcc';
                resultDiv.textContent = 'Felicitări! Răspuns corect! 🎉';
            } else {
                resultDiv.style.color = '#ff4d4d';
                resultDiv.textContent = 'Ai greșit! Încearcă data viitoare. ❌';
            }
        });
    </script>
</body>
</html>
