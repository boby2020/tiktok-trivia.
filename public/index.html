<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brad de Crăciun TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #050201;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        /* Format vertical 9:16 complet optimizat pentru ecranul de live */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 540px;
            background: radial-gradient(circle at 50% 35%, #231208 0%, #100602 60%, #030100 100%);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
        }
        /* Șemineu cald în fundal */
        .fireplace {
            position: absolute;
            bottom: 16%;
            left: 3%;
            width: 135px;
            height: 155px;
            background: #1c0f07;
            border: 4px solid #3d2110;
            border-radius: 10px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9), 0 0 15px rgba(249, 115, 22, 0.25);
            z-index: 1;
        }
        .fire-glow {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            height: 65px;
            background: radial-gradient(circle, #fb923c 0%, #dc2626 60%, transparent 100%);
            border-radius: 50%;
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 0.8; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(20, 11, 6, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #controls.hidden { transform: translateY(-160%); }
        .row { display: flex; gap: 6px; justify-content: center; align-items: center; }
        input {
            background: #0c0401;
            border: 1px solid #f59e0b;
            color: #fff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 13px;
            width: 140px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn-connect { background: #ec4899; }
        .btn-test { background: #10b981; }
        .btn-gift { background: #f59e0b; color: #000; }
        .btn-music { background: #8b5cf6; }
        #status { font-size: 11px; color: #cbd5e1; text-align: center; }
        
        #toggle-ui {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 11;
            background: rgba(0,0,0,0.6);
            color: #fde047;
            border: 1px solid rgba(245,158,11,0.5);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .bottom-banner {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 5;
            color: #fde047;
            font-weight: 900;
            font-size: 13px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="fireplace">
        <div style="position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 14px; color:#fdba74;">🔥 Șemineu</div>
        <div class="fire-glow"></div>
    </div>

    <canvas id="treeCanvas"></canvas>

    <button id="toggle-ui" onclick="toggleControls()">🎄</button>

    <div id="controls">
        <div class="row">
            <input type="text" id="username" value="eusebiusebisebi" placeholder="User TikTok">
            <button class="btn-connect" onclick="connectTikTok()">Conectează</button>
            <button class="btn-music" id="music-btn" onclick="toggleMusic()">🎵 Pornește Colinde</button>
        </div>
        <div class="row">
            <button class="btn-test" onclick="spawnOrnaments(6)">+ Adaugă Globuri</button>
            <button class="btn-gift" onclick="spawnGiantGift()">🎁 Cadou VIP</button>
        </div>
        <div id="status">Conectează Live-ul sau pornește muzica!</div>
    </div>

    <div class="bottom-banner">
        ✨ TAP-TAP & CADOURI = ÎMPODOBEȘTE BRADUL LA ȘEMINEU! ✨
    </div>
</div>

<!-- Player colinde integrat nativ -->
<audio id="festive-music" preload="auto" loop>
    <source src="https://actions.google.com/sounds/v1/holidays/christmas_pudding.ogg" type="audio/ogg">
</audio>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width, height;
    function resize() {
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Zăpadă
    const snowflakes = [];
    for (let i = 0; i < 55; i++) {
        snowflakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.5 + 0.8,
            speed: Math.random() * 1.2 + 0.4,
            opacity: Math.random() * 0.8 + 0.2
        });
    }

    const ornaments = [];
    const maxOrnaments = 55;

    class Ornament {
        constructor(userId, nickname, avatarUrl, points) {
            this.userId = userId;
            this.nickname = nickname || 'Guest';
            this.points = points;
            this.img = null;
            this.imgLoaded = false;

            if (avatarUrl) {
                const image = new Image();
                image.crossOrigin = "Anonymous";
                image.src = avatarUrl;
                image.onload = () => { this.img = image; this.imgLoaded = true; };
            }
            this.assignPosition();
        }

        assignPosition() {
            const topY = height * 0.25;
            const bottomY = height * 0.77;
            this.relY = Math.random();
            this.y = topY + this.relY * (bottomY - topY);
            const maxWidthAtY = this.relY * (width * 0.33) + 10;
            this.x = (width / 2) + (Math.random() - 0.5) * maxWidthAtY * 2;
            this.radius = 21 + Math.min(15, this.points / 100);
            this.color = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6'][Math.floor(Math.random() * 6)];
        }

        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(253, 224, 71, 0.4)';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.radius);
            ctx.lineTo(this.x, this.y - this.radius - 10);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.save();
            ctx.clip();

            if (this.imgLoaded && this.img) {
                ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            } else {
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(11, this.radius * 0.7)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.nickname.substring(0, 2).toUpperCase(), this.x, this.y);
            }

            const specular = ctx.createRadialGradient(
                this.x - this.radius * 0.35, this.y - this.radius * 0.35, 2,
                this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.9
            );
            specular.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
            specular.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
            specular.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
            ctx.fillStyle = specular;
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.95)';
            ctx.shadowBlur = 5;
            ctx.fillText(this.nickname.substring(0, 9), this.x, this.y + this.radius + 13);
            ctx.restore();
        }
    }

    function drawRealisticTree() {
        const cx = width / 2;
        const time = Date.now() * 0.003;

        // Steaua din vârf
        ctx.save();
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 35 + Math.sin(time * 2) * 15;
        ctx.font = '48px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⭐', cx, height * 0.15);
        ctx.restore();

        // Trunchi brad
        ctx.fillStyle = '#421d07';
        ctx.beginPath();
        ctx.roundRect(cx - 20, height * 0.76, 40, 45, 6);
        ctx.fill();

        // Cadouri luxuriante jos
        const gifts = [
            {x: cx - 65, y: height * 0.82, w: 42, h: 34, col: '#dc2626', bow: '#fde047'},
            {x: cx - 22, y: height * 0.80, w: 48, h: 40, col: '#f59e0b', bow: '#ffffff'},
            {x: cx + 22, y: height * 0.81, w: 40, h: 35, col: '#2563eb', bow: '#fde047'},
            {x: cx + 65, y: height * 0.83, w: 36, h: 30, col: '#16a34a', bow: '#dc2626'}
        ];
        gifts.forEach(g => {
            ctx.fillStyle = g.col;
            ctx.fillRect(g.x - g.w/2, g.y, g.w, g.h);
            ctx.fillStyle = g.bow;
            ctx.fillRect(g.x - 4, g.y, 8, g.h);
            ctx.fillRect(g.x - g.w/2, g.y + g.h/2 - 4, g.w, 8);
        });

        // Bradul bogat
        const levels = [
            { top: height * 0.19, mid: height * 0.32, bottom: height * 0.44, w: width * 0.27, col1: '#022c22', col2: '#065f46', col3: '#047857' },
            { top: height * 0.40, mid: height * 0.51, bottom: height * 0.62, w: width * 0.37, col1: '#064e3b', col2: '#059669', col3: '#047857' },
            { top: height * 0.58, mid: height * 0.68, bottom: height * 0.78, w: width * 0.47, col1: '#022c22', col2: '#047857', col3: '#065f46' }
        ];

        levels.forEach((lvl) => {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(cx, lvl.top);
            ctx.bezierCurveTo(cx + lvl.w * 0.5, lvl.mid, cx + lvl.w, lvl.bottom, cx + lvl.w * 0.95, lvl.bottom);
            ctx.lineTo(cx - lvl.w * 0.95, lvl.bottom);
            ctx.bezierCurveTo(cx - lvl.w, lvl.bottom, cx - lvl.w * 0.5, lvl.mid, cx, lvl.top);
            ctx.closePath();

            const grad = ctx.createLinearGradient(cx - lvl.w, 0, cx + lvl.w, 0);
            grad.addColorStop(0, lvl.col1);
            grad.addColorStop(0.4, lvl.col2);
            grad.addColorStop(1, lvl.col3);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        });

        // Ghirlande luminoase
        const lights = [
            {x: cx, y: height * 0.27}, {x: cx - 30, y: height * 0.42}, {x: cx + 35, y: height * 0.40},
            {x: cx - 60, y: height * 0.56}, {x: cx + 55, y: height * 0.54}, {x: cx, y: height * 0.50},
            {x: cx - 85, y: height * 0.69}, {x: cx + 80, y: height * 0.67}, {x: cx - 25, y: height * 0.63}
        ];
        lights.forEach((lt, idx) => {
            ctx.beginPath();
            ctx.arc(lt.x, lt.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = (idx % 2 === 0 && Math.sin(time * 3 + idx) > 0) ? '#fde047' : '#ef4444';
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 12;
            ctx.fill();
        });
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#ffffff';
        snowflakes.forEach(sf => {
            ctx.globalAlpha = sf.opacity;
            ctx.beginPath();
            ctx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2);
            ctx.fill();
            sf.y += sf.speed;
            if (sf.y > height) sf.y = 0;
        });
        ctx.globalAlpha = 1.0;

        drawRealisticTree();
        ornaments.forEach(o => o.draw());
        requestAnimationFrame(animate);
    }

    socket.on('tree-action', (data) => {
        addOrUpdateOrnament(data.userId, data.nickname, data.avatar, data.points);
    });

    socket.on('status-update', (data) => {
        const st = document.getElementById('status');
        if (data.connected) {
            st.style.color = '#4ade80';
            st.textContent = `🟢 Conectat la @${data.username}`;
        } else {
            st.style.color = '#fbbf24';
            st.textContent = `🟡 ${data.error}`;
        }
    });

    function addOrUpdateOrnament(userId, nickname, avatar, pts) {
        let existing = ornaments.find(o => o.userId === userId);
        if (existing) {
            existing.points += pts;
        } else {
            if (ornaments.length >= maxOrnaments) ornaments.shift();
            ornaments.push(new Ornament(userId, nickname, avatar, pts));
        }
    }

    function connectTikTok() {
        const user = document.getElementById('username').value.trim();
        if (!user) return;
        document.getElementById('status').textContent = `Se conectează la @${user}...`;
        socket.emit('connect-tiktok', user);
    }

    function toggleControls() {
        document.getElementById('controls').classList.toggle('hidden');
    }

    let musicPlaying = false;
    function toggleMusic() {
        const audio = document.getElementById('festive-music');
        const btn = document.getElementById('music-btn');
        if (musicPlaying) {
            audio.pause();
            musicPlaying = false;
            btn.textContent = '🎵 Pornește Colinde';
            btn.style.background = '#8b5cf6';
        } else {
            audio.play().then(() => {
                musicPlaying = true;
                btn.textContent = '🔇 Oprește Colinde';
                btn.style.background = '#ef4444';
            }).catch(e => {
                alert("Atinge ecranul o dată, apoi apasă din nou pe colinde!");
            });
        }
    }

    const sampleNames = ["Andrei", "Maria", "Alex", "Elena", "Denis", "Ioana", "Vlad", "Bianca", "Cristi", "Teo"];
    function spawnOrnaments(count) {
        for (let i = 0; i < count; i++) {
            const name = sampleNames[Math.floor(Math.random() * sampleNames.length)] + Math.floor(Math.random()*99);
            addOrUpdateOrnament('test_' + Math.random(), name, null, Math.floor(Math.random() * 250) + 30);
        }
    }
    function spawnGiantGift() {
        addOrUpdateOrnament('vip_gift', '🎅 Moș Crăciun', null, 2000);
    }

    spawnOrnaments(9);
    animate();
</script>
</body>
</html>
