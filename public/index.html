<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrei să fii Milionar? - TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #090a1a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .top-bar input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #f59e0b;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            width: 160px;
        }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-connect { background: #f59e0b; color: #000; }
        .btn-sound { background: #38bdf8; color: #000; }
        .status-text {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fde047, #f59e0b, #fde047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        /* Bara de timp */
        .timer-wrapper {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid #475569;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            transition: width 0.2s linear;
        }
        /* Cutia cu întrebarea */
        .question-box {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(180deg, #1e3a8a 0%, #172554 100%);
            border: 2px solid #f59e0b;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(30, 58, 138, 0.8);
            margin-bottom: 16px;
            min-height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Variantele de răspuns */
        .options-grid {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s;
        }
        .option-btn:hover { border-color: #f59e0b; }
        .option-label {
            color: #f59e0b;
            margin-right: 10px;
            font-size: 18px;
        }
        .option-votes {
            font-size: 12px;
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            color: #cbd5e1;
        }
        .option-correct {
            background: linear-gradient(90deg, #15803d 0%, #166534 100%) !important;
            border-color: #4ade80 !important;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
            transform: scale(1.02);
        }
        .option-wrong {
            opacity: 0.45;
        }
        /* Banner anunț câștigător rundă */
        .round-banner {
            width: 100%;
            max-width: 500px;
            margin-top: 14px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #fde047;
            min-height: 42px;
        }
        /* Clasament Live */
        .leaderboard {
            width: 100%;
            max-width: 500px;
            margin-top: 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
        }
        .leaderboard h3 {
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
        }
        .leader-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }
        .leader-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="text" id="tiktokUser" value="eusebiusebisebi" placeholder="User TikTok">
        <button class="btn btn-connect" onclick="connectLive()">Conectează</button>
        <button class="btn btn-sound" id="soundBtn" onclick="enableAudio()">🔊 Activează Vocea</button>
    </div>
    <div class="status-text" id="statusText">Scrie A, B, C, D sau 1, 2, 3, 4 în chat-ul TikTok!</div>

    <div class="logo">💎 Vrei să fii Milionar? 💎</div>

    <div class="timer-wrapper">
        <div class="timer-bar" id="timerBar"></div>
    </div>

    <div class="question-box" id="questionBox">Se încarcă întrebarea...</div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="round-banner" id="roundBanner">Așteptăm răspunsurile voastre în comentarii!</div>

    <div class="leaderboard">
        <h3>🏆 Clasament Jucători Live</h3>
        <div id="leaderList">
            <div style="text-align:center; color:#64748b; font-size:13px;">Încă nu sunt puncte. Răspunde primul!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const questions = [
            { q: "Care este cel mai lung fluviu din Europa?", opts: ["Dunărea", "Volga", "Rin", "Nipru"], ans: 1 },
            { q: "În ce an a avut loc Marea Unire de la Alba Iulia?", opts: ["1859", "1918", "1945", "1989"], ans: 1 },
            { q: "Care este cel mai înalt vârf muntos din România?", opts: ["Omu", "Negoiu", "Moldoveanu", "Parângul Mare"], ans: 2 },
            { q: "Câte planete are Sistemul Solar?", opts: ["7", "8", "9", "10"], ans: 1 },
            { q: "Cine a scris poezia „Luceafărul”?", opts: ["Ion Creangă", "Mihai Eminescu", "George Coșbuc", "Tudor Arghezi"], ans: 1 },
            { q: "Care este capitala Italiei?", opts: ["Milano", "Veneția", "Roma", "Napoli"], ans: 2 },
            { q: "Ce element chimic are simbolul „Au”?", opts: ["Argint", "Aluminiu", "Aur", "Argon"], ans: 2 },
            { q: "Câte zile are un an bisect?", opts: ["364", "365", "366", "367"], ans: 2 },
            { q: "Care este cel mai mare ocean de pe Pământ?", opts: ["Atlantic", "Indian", "Arctic", "Pacific"], ans: 3 },
            { q: "Cine a pictat celebra operă „Mona Lisa”?", opts: ["Pablo Picasso", "Leonardo da Vinci", "Vincent van Gogh", "Michelangelo"], ans: 1 },
            { q: "În ce oraș se află Turnul Eiffel?", opts: ["Londra", "Madrid", "Paris", "Berlin"], ans: 2 },
            { q: "Care este moneda oficială a Marii Britanii?", opts: ["Euro", "Dolar", "Liră sterlină", "Franc"], ans: 2 },
            { q: "Câte continente există pe Pământ?", opts: ["5", "6", "7", "8"], ans: 2 },
            { q: "Ce animal este supranumit „Regele Junglei”?", opts: ["Tigrul", "Leul", "Elefantul", "Ghepardul"], ans: 1 },
            { q: "Care este cea mai apropiată planetă de Soare?", opts: ["Venus", "Marte", "Mercur", "Pământ"], ans: 2 }
        ];

        const letters = ["A", "B", "C", "D"];
        let currentIdx = 0;
        let roundOpen = true;
        let timeLeft = 18;
        const ROUND_SECONDS = 18;
        let audioEnabled = false;
        let scores = {}; // userId -> { nickname, points }
        let roundAnswers = {}; // userId -> { nickname, answerIndex }

        function enableAudio() {
            audioEnabled = true;
            const btn = document.getElementById('soundBtn');
            btn.textContent = '🔊 Voce Activă';
            btn.style.background = '#22c55e';
            speak("Bun venit la Vrei să fii milionar! Scrieți A, B, C sau D în comentarii!");
        }

        function speak(text) {
            if (!audioEnabled) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ro-RO';
            u.rate = 1.05;
            window.speechSynthesis.speak(u);
        }

        function connectLive() {
            const user = document.getElementById('tiktokUser').value.trim();
            if (!user) return;
            document.getElementById('statusText').textContent = `Se conectează la @${user}...`;
            socket.emit('connect-tiktok', user);
        }

        socket.on('status-update', (data) => {
            const st = document.getElementById('statusText');
            if (data.connected) {
                st.style.color = '#4ade80';
                st.textContent = `🟢 Conectat LIVE la @${data.username}`;
            } else {
                st.style.color = '#fbbf24';
                st.textContent = `🟡 ${data.error}`;
            }
        });

        socket.on('player-answer', (data) => {
            registerAnswer(data.userId, data.nickname, data.answerIndex);
        });

        function registerAnswer(userId, nickname, answerIndex) {
            if (!roundOpen) return;
            roundAnswers[userId] = { nickname, answerIndex };
            updateVoteCounts();
            document.getElementById('roundBanner').textContent = `💬 ${nickname} a ales varianta ${letters[answerIndex]}!`;
        }

        function updateVoteCounts() {
            const counts = [0, 0, 0, 0];
            Object.values(roundAnswers).forEach(a => counts[a.answerIndex]++);
            for (let i = 0; i < 4; i++) {
                const el = document.getElementById(`votes-${i}`);
                if (el) el.textContent = `${counts[i]} voturi`;
            }
        }

        function loadQuestion() {
            roundOpen = true;
            roundAnswers = {};
            timeLeft = ROUND_SECONDS;
            const item = questions[currentIdx];

            document.getElementById('questionBox').textContent = item.q;
            document.getElementById('roundBanner').textContent = "Scrie 1, 2, 3, 4 sau A, B, C, D în comentarii!";

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            item.opts.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.id = `opt-${idx}`;
                btn.onclick = () => registerAnswer('host', 'Gazda Live', idx);
                btn.innerHTML = `
                    <div><span class="option-label">${letters[idx]}:</span> ${opt}</div>
                    <span class="option-votes" id="votes-${idx}">0 voturi</span>
                `;
                grid.appendChild(btn);
            });

            speak(`${item.q} ... A: ${item.opts[0]}. B: ${item.opts[1]}. C: ${item.opts[2]}. D: ${item.opts[3]}.`);
        }

        function endRound() {
            roundOpen = false;
            const item = questions[currentIdx];
            const correctIdx = item.ans;

            for (let i = 0; i < 4; i++) {
                const el = document.getElementById(`opt-${i}`);
                if (i === correctIdx) el.classList.add('option-correct');
                else el.classList.add('option-wrong');
            }

            // Calculăm câștigătorii rundei
            const winners = [];
            Object.entries(roundAnswers).forEach(([uid, info]) => {
                if (info.answerIndex === correctIdx) {
                    winners.push(info.nickname);
                    if (!scores[uid]) scores[uid] = { nickname: info.nickname, points: 0 };
                    scores[uid].points += 10;
                }
            });

            updateLeaderboard();

            const correctText = `${letters[correctIdx]}, ${item.opts[correctIdx]}`;
            if (winners.length > 0) {
                const firstWinner = winners[0];
                document.getElementById('roundBanner').textContent = `🎉 Corect: ${correctText}! Bravo ${winners.slice(0, 3).join(', ')}!`;
                speak(`Timpul a expirat! Răspunsul corect este ${correctText}. Felicitări ${firstWinner}, ai câștigat 10 puncte!`);
            } else {
                document.getElementById('roundBanner').textContent = `✅ Răspunsul corect era: ${correctText}!`;
                speak(`Timpul a expirat! Răspunsul corect este ${correctText}. Pregătiți-vă pentru următoarea întrebare!`);
            }

            setTimeout(() => {
                currentIdx = (currentIdx + 1) % questions.length;
                loadQuestion();
            }, 6000);
        }

        function updateLeaderboard() {
            const list = Object.values(scores).sort((a, b) => b.points - a.points).slice(0, 5);
            const container = document.getElementById('leaderList');
            if (list.length === 0) return;

            container.innerHTML = list.map((p, i) => `
                <div class="leader-row">
                    <span><strong>#${i + 1}</strong> ${p.nickname}</span>
                    <span style="color:#fde047; font-weight:bold;">${p.points} pct</span>
                </div>
            `).join('');
        }

        // Bucla de timp (100ms)
        setInterval(() => {
            if (!roundOpen) return;
            timeLeft -= 0.1;
            const pct = Math.max(0, (timeLeft / ROUND_SECONDS) * 100);
            document.getElementById('timerBar').style.width = `${pct}%`;

            if (timeLeft <= 0) {
                endRound();
            }
        }, 100);

        // Pornim prima întrebare imediat
        loadQuestion();
    </script>
</body>
</html>
